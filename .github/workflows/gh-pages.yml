name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --wasm --release --base-href /

      - name: Add GitHub Pages SPA fallback
        run: |
          cp build/web/index.html build/web/404.html
          # GitHub Pages has no server-side rewrites, so 404.html always
          # answers with an HTTP 404 status even though it serves the app
          # shell -- Google Play's automated policy checker follows the
          # status code, not the content, and flags the privacy policy and
          # account deletion URLs as broken. Serve those two exact paths as
          # native static files so they get a real 200 while still booting
          # the same SPA, which then client-side routes to the right page.
          cp build/web/index.html build/web/privacy.html
          cp build/web/index.html build/web/delete-account.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
